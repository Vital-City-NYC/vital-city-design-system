<!doctype html><meta charset="utf-8"><link rel=stylesheet href=_card.css>
<style>
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.photo{aspect-ratio:4/3;background:#ddd;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.05)}
.bw img{filter:grayscale(1) contrast(1.1)}
.lbl{font-family:var(--sans);font-weight:700;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#707175;margin:8px 0 0}
</style>
<div class=card style="padding:18px 22px">
<div class=grid>
 <div>
  <div class=photo><img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?w=600&h=450&fit=crop"></div>
  <div class=lbl>Color · high-contrast · urban subject</div>
 </div>
 <div>
  <div class="photo bw"><img src="https://images.unsplash.com/photo-1543059080-f9b1272213d5?w=600&h=450&fit=crop"></div>
  <div class=lbl>Black &amp; white · documentary register</div>
 </div>
</div>
</div>
