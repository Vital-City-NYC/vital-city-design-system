<!doctype html><meta charset="utf-8"><link rel=stylesheet href=_card.css>
<style>
.s-chip{flex:1;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;color:#050507}
.s-chip.dark{color:#fff}
.sw-name{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.sw-hex{font-family:var(--chart);font-size:11px;opacity:.85;margin-top:3px}
.row{display:flex;gap:0}
</style>
<div class=card style="padding:18px 22px">
  <div class=row>
    <div class="s-chip dark" style="background:#cea9be"><span class=sw-name>Rose</span><span class=sw-hex>#cea9be</span></div>
    <div class="s-chip dark" style="background:#e7466d"><span class=sw-name style="color:#fff">Magenta</span><span class=sw-hex style="color:#fff">#e7466d</span></div>
    <div class="s-chip dark" style="background:#707175"><span class=sw-name style="color:#fff">Charcoal</span><span class=sw-hex style="color:#fff">#707175</span></div>
    <div class="s-chip dark" style="background:#394882"><span class=sw-name style="color:#fff">Indigo</span><span class=sw-hex style="color:#fff">#394882</span></div>
    <div class="s-chip dark" style="background:#217ebe"><span class=sw-name style="color:#fff">Cerulean</span><span class=sw-hex style="color:#fff">#217ebe</span></div>
  </div>
</div>
