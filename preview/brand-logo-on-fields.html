<!doctype html><meta charset="utf-8"><link rel=stylesheet href=_card.css>
<style>
.quad{display:grid;grid-template-columns:1fr 1fr;gap:0}
.q{display:flex;align-items:center;justify-content:center;padding:28px 16px;min-height:120px;position:relative}
.q .mark{font-family:var(--sans);font-weight:900;font-size:26px;letter-spacing:-.02em;line-height:1}
.lbl{font-family:var(--sans);font-weight:700;font-size:9px;letter-spacing:.08em;text-transform:uppercase;position:absolute;top:8px;left:10px}
</style>
<div class=card style="padding:16px 22px">
<div class=quad>
 <div class=q style="background:#fff;border:1px solid #eee"><span class=lbl style="color:#707175">White</span><img src="../assets/vc-logo-black.png" style="height:30px"></div>
 <div class=q style="background:#050507"><span class=lbl style="color:#fff">Black</span><img src="../assets/vc-logo-black.png" style="height:30px;filter:brightness(0) invert(1)"></div>
 <div class=q style="background:#ff7c53"><span class=lbl style="color:#fff">Safety Orange</span><img src="../assets/vc-logo-black.png" style="height:30px;filter:brightness(0) invert(1)"></div>
 <div class=q style="background:#dde44c"><span class=lbl style="color:#050507">Chartreuse</span><img src="../assets/vc-logo-black.png" style="height:30px"></div>
</div>
</div>
