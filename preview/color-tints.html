<!doctype html><meta charset="utf-8"><link rel=stylesheet href=_card.css>
<style>

.head{font-family:var(--sans);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#707175;width:96px;display:flex;align-items:center;padding-left:4px}

<div class=card style="padding:18px 22px">
