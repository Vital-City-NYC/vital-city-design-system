<!doctype html><meta charset="utf-8"><link rel=stylesheet href=_card.css>
<style>
.s-chip{flex:1;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;color:#050507}
.s-chip.dark{color:#fff}
.sw-name{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.sw-hex{font-family:var(--chart);font-size:11px;opacity:.85;margin-top:3px}
.row{display:flex;gap:0}
</style>
<div class=card style="padding:18px 22px">
  <div class=row>
    <div class=s-chip style="background:#050507" class=dark><span class=sw-name style="color:#fff">Black</span><span class=sw-hex style="color:#fff">#050507</span></div>
    <div class=s-chip style="background:#fff;border:1px solid #ddd"><span class=sw-name>White</span><span class=sw-hex>#ffffff</span></div>
    <div class=s-chip style="background:#dddddd"><span class=sw-name>Cloud</span><span class=sw-hex>#dddddd</span></div>
    <div class=s-chip style="background:#dde44c"><span class=sw-name>Chartreuse</span><span class=sw-hex>#dde44c</span></div>
    <div class=s-chip style="background:#ff7c53"><span class=sw-name>Safety Orange</span><span class=sw-hex>#ff7c53</span></div>
    <div class=s-chip style="background:#9b9fbc"><span class=sw-name>Periwinkle</span><span class=sw-hex>#9b9fbc</span></div>
  </div>
</div>
