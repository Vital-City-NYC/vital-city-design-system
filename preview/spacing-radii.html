<!doctype html><meta charset="utf-8"><link rel=stylesheet href=_card.css>
<style>
.demo{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.box{background:#fff;border:1px solid #050507;padding:18px;min-height:110px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#050507}
.pill{border-radius:999px;background:#050507;color:#fff;padding:.55rem 1.1rem;font-family:var(--sans);font-weight:700;font-size:.875rem;letter-spacing:.04em;text-transform:uppercase;display:inline-block}
.lbl{font-family:var(--sans);font-weight:700;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#707175;margin-bottom:8px}
</style>
<div class=card style="padding:20px 24px">
<div class=demo>
 <div>
  <div class=lbl>Default · 0 radius</div>
  <div class=box>Square</div>
 </div>
 <div>
  <div class=lbl>Pill · 999px — CTA only</div>
  <div class=box style="border:0;padding:0;align-items:center"><span class=pill>Donate</span></div>
 </div>
</div>
</div>
