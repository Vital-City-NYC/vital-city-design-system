<!doctype html><meta charset="utf-8"><link rel=stylesheet href=_card.css>
<style>
.row{display:flex;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid #eee}
.row:last-child{border-bottom:0}
.block{background:#050507;height:22px}
.tok{font-family:var(--chart);font-size:11px;color:#050507;width:60px}
.px{font-family:var(--chart);font-size:11px;color:#707175;width:60px}
.use{font-family:var(--sans);font-weight:300;font-size:12px;color:#050507}
</style>
<div class=card style="padding:14px 24px">
<div class=row><span class=tok>--s1</span><span class=px>4 px</span><span class=block style="width:4px"></span><span class=use>Micro — tick gaps</span></div>
<div class=row><span class=tok>--s2</span><span class=px>8 px</span><span class=block style="width:8px"></span><span class=use>Small — inline gap, padding</span></div>
<div class=row><span class=tok>--s3</span><span class=px>12 px</span><span class=block style="width:12px"></span><span class=use>Default gap</span></div>
<div class=row><span class=tok>--s4</span><span class=px>16 px</span><span class=block style="width:16px"></span><span class=use>Paragraph</span></div>
<div class=row><span class=tok>--s5</span><span class=px>24 px</span><span class=block style="width:24px"></span><span class=use>Section stack</span></div>
<div class=row><span class=tok>--s6</span><span class=px>32 px</span><span class=block style="width:32px"></span><span class=use>Major gap</span></div>
<div class=row><span class=tok>--s7</span><span class=px>48 px</span><span class=block style="width:48px"></span><span class=use>Between sections</span></div>
<div class=row><span class=tok>--s8</span><span class=px>72 px</span><span class=block style="width:72px"></span><span class=use>Hero top/bottom</span></div>
<div class=row><span class=tok>--s9</span><span class=px>96 px</span><span class=block style="width:96px"></span><span class=use>Footer top / page breaks</span></div>
</div>
