<!doctype html><meta charset="utf-8"><link rel=stylesheet href=_card.css>
<style>
.grad{height:58px;display:flex}
.step{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:4px 2px;font-family:var(--chart);font-size:9px;color:#050507}
.lbl{font-family:var(--sans);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#707175;margin-bottom:6px}
</style>
<div class=card style="padding:18px 22px">

<div class=grad style="background:linear-gradient(to right,#dde44c,#ff7c53)"></div>

</div>

<div class=grad>
 <div class=step style="background:#ff7c53">#ff7c53</div>
 <div class=step style="background:#fb693c;color:#fff">#fb693c</div>
 <div class=step style="background:#ed5236;color:#fff">#ed5236</div>
 <div class=step style="background:#e03a30;color:#fff">#e03a30</div>
 <div class=step style="background:#d2232a;color:#fff">#d2232a</div>

</div>
