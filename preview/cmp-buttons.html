<!doctype html><meta charset="utf-8"><link rel=stylesheet href=_card.css>
<style>
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.55rem 1.1rem;font-family:var(--sans);font-weight:700;font-size:.875rem;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;border:2px solid #050507;background:#050507;color:#fff;border-radius:999px;cursor:pointer;transition:background 120ms linear,color 120ms linear,border-color 120ms linear}
.btn:hover{background:#ff7c53;border-color:#ff7c53;color:#fff}
.ghost{background:transparent;color:#050507}
.ghost:hover{background:#050507;color:#fff;border-color:#050507}
.orange{background:#ff7c53;border-color:#ff7c53;color:#fff}
.orange:hover{background:#050507;border-color:#050507}
.sq{border-radius:0}
.lbl{font-family:var(--sans);font-weight:700;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#707175;margin-bottom:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sub{font-family:var(--chart);font-size:10px;color:#707175}
</style>
<div class=card style="padding:20px 24px">
<div class=lbl>Buttons · variants</div>
<div class=row>
 <a class=btn href=#>Donate</a>
 <a class="btn ghost" href=#>Subscribe</a>
 <a class="btn orange" href=#>Explore data</a>
 <a class="btn sq" href=#>Read more</a>
</div>
<div class=sub>Default black pill · ghost (hollow → fill) · orange flood · square-edge variant. Hover = 120ms linear color swap only, no lift, no scale.</div>
</div>
